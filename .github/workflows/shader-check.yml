# Grass-specific: compiles the shipped compute kernels and shader passes offline with DXC (DXIL and SPIR-V) against the
# pinned URP 17.6 headers. The shared Package CI cannot do this without a Unity licence.
name: Shader check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shader-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders:
    name: Compile HLSL to DXIL and SPIR-V
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Shader tooling tests
        run: python -B -m unittest discover -s Tools~/ShaderChecks -p 'test_*.py'
      - name: Compile shipped kernels and shader passes
        run: python3 -B Tools~/ShaderChecks/check.py
