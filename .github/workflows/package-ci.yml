# Shared Cone package CI (template: copy unchanged). Package specifics go in Tools~/ci/test-project.json:
#   {"modes": ["EditMode", "PlayMode"], "dependencies": {...}, "testables": [...], "assemblyNames": [...]}
#   (every key optional; assemblyNames limits the run to those test assemblies, e.g. when a testable dependency is
#   only there for its test fixture;
#   modes defaults to both; an editor-only package lists ["EditMode"]) and in extra Tools~/ci/check_*.py scripts.
# hygiene: release shape of the package (Tools~/ci/check_package.py, stdlib Python).
# format:  dotnet format whitespace against the shared .editorconfig.
# unity:   EditMode and PlayMode tests in a generated project that contains only this package. Runs only when the
#          UNITY_LICENSE secret exists; otherwise it says so and skips. It fails when a mode ran no tests.
name: Package CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.6.7f1

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Checker self-tests
        run: python3 -m unittest discover -s 'Tools~/ci' -p 'test_*.py' -v
      - name: Check package shape
        run: python3 'Tools~/ci/check_package.py'
      - name: Package-specific checks
        run: |
          shopt -s nullglob
          for script in Tools~/ci/check_*.py; do
            [ "$(basename "$script")" = check_package.py ] && continue
            echo "::group::$script"; python3 "$script"; echo "::endgroup::"
          done

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Whitespace and layout match .editorconfig
        run: dotnet format whitespace --folder --verify-no-changes --verbosity minimal .

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      modes: ${{ steps.modes.outputs.modes }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Test modes this package declares
        id: modes
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, sys
          path = pathlib.Path("Tools~/ci/test-project.json")
          modes = json.loads(path.read_text()).get("modes", ["EditMode", "PlayMode"]) if path.exists() else ["EditMode", "PlayMode"]
          if not modes or any(m not in ("EditMode", "PlayMode") for m in modes):
              sys.exit(f"Tools~/ci/test-project.json: modes must be a non-empty subset of EditMode, PlayMode (got {modes})")
          print("modes=" + json.dumps(modes))
          PY

  unity:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.plan.outputs.modes) }}
    steps:
      - name: Licence present?
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          REQUIRE_UNITY_TESTS: ${{ vars.REQUIRE_UNITY_TESTS }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            # Set the repository variable REQUIRE_UNITY_TESTS=true to make a missing licence fail instead of skip.
            if [ "$REQUIRE_UNITY_TESTS" = "true" ]; then
              echo "::error title=Unity tests required::REQUIRE_UNITY_TESTS is set but there is no UNITY_LICENSE secret."
              exit 1
            fi
            echo "::notice title=Unity tests skipped::No UNITY_LICENSE secret in this repository; ${{ matrix.mode }} tests did not run (this is not a pass)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        if: steps.licence.outputs.present == 'true'
        with:
          path: package
          persist-credentials: false
      - name: Generate a test project containing only this package
        id: project
        if: steps.licence.outputs.present == 'true'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          package = json.loads(pathlib.Path("package/package.json").read_text())
          extra_path = pathlib.Path("package/Tools~/ci/test-project.json")
          extra = json.loads(extra_path.read_text()) if extra_path.exists() else {}
          deps = {package["name"]: "file:../../package", "com.unity.test-framework": "1.8.0"}
          deps.update(extra.get("dependencies", {}))
          root = pathlib.Path("project")
          (root / "Packages").mkdir(parents=True)
          (root / "Assets").mkdir()
          (root / "ProjectSettings").mkdir()
          manifest = {"dependencies": deps, "testables": [package["name"]] + extra.get("testables", [])}
          (root / "Packages/manifest.json").write_text(json.dumps(manifest, indent=2))
          (root / "ProjectSettings/ProjectVersion.txt").write_text("m_EditorVersion: ${{ env.UNITY_VERSION }}\n")
          names = extra.get("assemblyNames", [])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("params=" + ("-assemblyNames " + ";".join(names) if names else "") + "\n")
          print(json.dumps(manifest, indent=2))
          PY
      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        if: steps.licence.outputs.present == 'true'
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: project
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.mode }}
          artifactsPath: artifacts-${{ matrix.mode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.mode }} results
          customParameters: ${{ steps.project.outputs.params }}
      - name: Require tests to have run
        if: always() && steps.licence.outputs.present == 'true'
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("artifacts-${{ matrix.mode }}/*.xml")
          if not files:
              sys.exit("No test results were written: the run did not happen.")
          run = ET.parse(files[0]).getroot()
          total, passed, failed = (int(run.get(k, 0)) for k in ("total", "passed", "failed"))
          print(f"${{ matrix.mode }}: total={total} passed={passed} failed={failed} skipped={run.get('skipped')} result={run.get('result')}")
          if total == 0:
              sys.exit("${{ matrix.mode }}: 0 tests ran. A run with no tests is not a pass.")
          if failed:
              sys.exit(f"${{ matrix.mode }}: {failed} test(s) failed.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.licence.outputs.present == 'true'
        with:
          name: test-results-${{ matrix.mode }}
          path: artifacts-${{ matrix.mode }}
